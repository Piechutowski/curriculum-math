  - { trigger: ";calL;", replace: "ℒ" } # languages (08)
  - { trigger: ";calM;", replace: "ℳ" }
  - { trigger: ";calN;", replace: "𝒩" } # normal distribution (06)
  - { trigger: ";calP;", replace: "𝒫" }
  - { trigger: ";calQ;", replace: "𝒬" }
  - { trigger: ";calR;", replace: "ℛ" }
  - { trigger: ";calS;", replace: "𝒮" }
