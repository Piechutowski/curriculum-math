  - { trigger: ";calU;", replace: "𝒰" }
  - { trigger: ";calV;", replace: "𝒱" }
  - { trigger: ";calW;", replace: "𝒲" }
  - { trigger: ";calX;", replace: "𝒳" }
  - { trigger: ";calY;", replace: "𝒴" }
  - { trigger: ";calZ;", replace: "𝒵" }

  # ---------------------------------------------------------------- Superscripts: ;^2; ;^n; ;^T; ;^-; ...
  - { trigger: ";^0;", replace: "⁰" }
  - { trigger: ";^1;", replace: "¹" }
  - { trigger: ";^2;", replace: "²" }
  - { trigger: ";^3;", replace: "³" }
  - { trigger: ";^4;", replace: "⁴" }
  - { trigger: ";^5;", replace: "⁵" }
  - { trigger: ";^6;", replace: "⁶" }
  - { trigger: ";^7;", replace: "⁷" }
  - { trigger: ";^8;", replace: "⁸" }
  - { trigger: ";^9;", replace: "⁹" }
  - { trigger: ";^+;", replace: "⁺" }
  - { trigger: ";^-;", replace: "⁻" }
  - { trigger: ";^=;", replace: "⁼" }
  - { trigger: ";^(;", replace: "⁽" }
  - { trigger: ";^);", replace: "⁾" }
  - { trigger: ";^a;", replace: "ᵃ" }
  - { trigger: ";^b;", replace: "ᵇ" }
