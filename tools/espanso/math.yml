  - { trigger: ";bbY;", replace: "𝕐" }
  - { trigger: ";bbZ;", replace: "ℤ" }

  # ---------------------------------------------------------------- Calligraphic, full alphabet: ;calA; .. ;calZ;
  - { trigger: ";calA;", replace: "𝒜" }
  - { trigger: ";calB;", replace: "ℬ" }
  - { trigger: ";calC;", replace: "𝒞" }
  - { trigger: ";calD;", replace: "𝒟" }
  - { trigger: ";calE;", replace: "ℰ" }
