<svg xmlns="http://www.w3.org/2000/svg" width="660" height="360" viewBox="0 0 660 360">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
  </defs>

  <!-- rectangles P_1 .. P_n (hatched, dashed outline as in the notes) -->
  <rect x="115" y="70" width="55" height="230" fill="url(#hatch)"/>
  <rect class="ink-thin dashed" x="115" y="70" width="55" height="230"/>
  <rect x="170" y="185" width="55" height="115" fill="url(#hatch)"/>
  <rect class="ink-thin dashed" x="170" y="185" width="55" height="115"/>
  <rect x="225" y="223.3" width="55" height="76.7" fill="url(#hatch)"/>
  <rect class="ink-thin dashed" x="225" y="223.3" width="55" height="76.7"/>
  <rect x="472.5" y="269.3" width="55" height="30.7" fill="url(#hatch)"/>
  <rect class="ink-thin dashed" x="472.5" y="269.3" width="55" height="30.7"/>
  <rect x="527.5" y="272.9" width="55" height="27.1" fill="url(#hatch)"/>
  <rect class="ink-thin dashed" x="527.5" y="272.9" width="55" height="27.1"/>

  <!-- curve f(x) = 1/x -->
  <path class="ink" d="M 105.1 19.5 L 116.1 74.5 L 127.1 111.5 L 138.1 138.0 L 149.1 158.0 L 160.1 173.6 L 171.1 186.1 L 182.1 196.4 L 193.1 205.0 L 204.1 212.2 L 215.1 218.4 L 226.1 223.8 L 237.1 228.6 L 248.1 232.7 L 259.1 236.5 L 270.1 239.8 L 281.1 242.8 L 292.1 245.5 L 303.1 248.0 L 314.1 250.2 L 325.1 252.3 L 336.1 254.2 L 347.1 255.9 L 358.1 257.6 L 369.1 259.1 L 380.1 260.5 L 391.1 261.8 L 402.1 263.0 L 413.1 264.2 L 424.1 265.3 L 435.1 266.3 L 446.1 267.2 L 457.1 268.1 L 468.1 269.0 L 479.1 269.8 L 490.1 270.6 L 501.1 271.3 L 512.1 272.0 L 523.1 272.7 L 534.1 273.3 L 545.1 273.9 L 556.1 274.5 L 567.1 275.1 L 578.1 275.6 L 589.1 276.1 L 600.1 276.6"/>

  <!-- axes -->
  <path class="ink-thin" d="M 60 325 V 18 M 60 18 l -4.5 9 M 60 18 l 4.5 9"/>
  <path class="ink-thin" d="M 40 300 H 640 M 640 300 l -9 -4.5 M 640 300 l -9 4.5"/>

  <!-- y tick: 1 -->
  <path class="ink-thin" d="M 56 70 H 64"/>
  <text class="txt" x="40" y="76" font-size="18">1</text>
  <text class="txt" x="44" y="36" font-size="19">y</text>

  <!-- x ticks -->
  <path class="ink-thin" d="M 115 296 V 304 M 170 296 V 304 M 225 296 V 304 M 280 296 V 304 M 472.5 296 V 304 M 527.5 296 V 304 M 582.5 296 V 304"/>
  <text class="txt" x="110" y="325" font-size="18">1</text>
  <text class="txt" x="165" y="325" font-size="18">2</text>
  <text class="txt" x="220" y="325" font-size="18">3</text>
  <text class="txt" x="275" y="325" font-size="18">4</text>
  <text class="txt" x="330" y="322" font-size="18">. . . .</text>
  <text class="txt" x="452" y="325" font-size="18">n−1</text>
  <text class="txt" x="522" y="325" font-size="18">n</text>
  <text class="txt" x="565" y="325" font-size="18">n+1</text>
  <text class="txt" x="632" y="326" font-size="19">x</text>

  <!-- rectangle labels -->
  <text class="txt" x="132" y="60" font-size="18">P<tspan font-size="13" dy="4">1</tspan></text>
  <text class="txt" x="187" y="176" font-size="18">P<tspan font-size="13" dy="4">2</tspan></text>
  <text class="txt" x="242" y="215" font-size="18">P<tspan font-size="13" dy="4">3</tspan></text>
  <text class="txt" x="465" y="248" font-size="17">P<tspan font-size="12" dy="4">n−1</tspan></text>
  <path class="ink-thin" d="M 490 253 L 496 265 M 496 265 l -1 -7 M 496 265 l -6 -4"/>
  <text class="txt" x="596" y="266" font-size="17">P<tspan font-size="12" dy="4">n</tspan></text>
  <path class="ink-thin" d="M 598 268 L 572 280 M 572 280 l 7.5 -1 M 572 280 l 5 -6"/>

  <!-- curve label -->
  <text class="txt" x="340" y="234" font-size="19">f(x) = 1/x</text>
</svg>
