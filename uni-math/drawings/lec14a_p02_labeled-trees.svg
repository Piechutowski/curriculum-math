<svg xmlns="http://www.w3.org/2000/svg" width="500" height="215" viewBox="0 0 500 215">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- left tree: s root; children t, x; t -> u,v,w; x -> y,z -->
  <path class="ink" d="M 115 35 L 60 95 M 115 35 L 175 95"/>
  <path class="ink" d="M 60 95 L 20 165 M 60 95 L 60 165 M 60 95 L 105 165"/>
  <path class="ink" d="M 175 95 L 145 165 M 175 95 L 210 165"/>
  <circle class="fill" cx="115" cy="35" r="5"/>
  <circle class="fill" cx="60" cy="95" r="5"/>
  <circle class="fill" cx="175" cy="95" r="5"/>
  <circle class="fill" cx="20" cy="165" r="5"/>
  <circle class="fill" cx="60" cy="165" r="5"/>
  <circle class="fill" cx="105" cy="165" r="5"/>
  <circle class="fill" cx="145" cy="165" r="5"/>
  <circle class="fill" cx="210" cy="165" r="5"/>
  <text class="txt" x="125" y="32" font-size="19">s</text>
  <text class="txt" x="42" y="90" font-size="19">t</text>
  <text class="txt" x="187" y="92" font-size="19">x</text>
  <text class="txt" x="12" y="190" font-size="19">u</text>
  <text class="txt" x="54" y="190" font-size="19">v</text>
  <text class="txt" x="98" y="190" font-size="19">w</text>
  <text class="txt" x="139" y="190" font-size="19">y</text>
  <text class="txt" x="206" y="190" font-size="19">z</text>

  <!-- right tree: same tree drawn as a cross -->
  <path class="ink" d="M 380 25 L 380 180"/>
  <path class="ink" d="M 320 80 L 440 80"/>
  <path class="ink" d="M 320 180 L 440 180"/>
  <circle class="fill" cx="380" cy="25" r="5"/>
  <circle class="fill" cx="380" cy="80" r="5"/>
  <circle class="fill" cx="320" cy="80" r="5"/>
  <circle class="fill" cx="440" cy="80" r="5"/>
  <circle class="fill" cx="380" cy="130" r="5"/>
  <circle class="fill" cx="380" cy="180" r="5"/>
  <circle class="fill" cx="320" cy="180" r="5"/>
  <circle class="fill" cx="440" cy="180" r="5"/>
  <text class="txt" x="390" y="22" font-size="19">w</text>
  <text class="txt" x="390" y="74" font-size="19">t</text>
  <text class="txt" x="302" y="76" font-size="19">u</text>
  <text class="txt" x="452" y="86" font-size="19">v</text>
  <text class="txt" x="392" y="128" font-size="19">s</text>
  <text class="txt" x="392" y="176" font-size="19">x</text>
  <text class="txt" x="310" y="204" font-size="19">y</text>
  <text class="txt" x="436" y="204" font-size="19">z</text>
</svg>
