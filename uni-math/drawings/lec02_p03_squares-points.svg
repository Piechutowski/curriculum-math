<svg xmlns="http://www.w3.org/2000/svg" width="200" height="165" viewBox="0 0 200 165">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    .dotted { stroke-dasharray:2 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="fill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <path class="ink-thin" d="M 20 140 H 190" marker-end="url(#ah)"/>
  <path class="ink-thin" d="M 50 158 V 20" marker-end="url(#ah)"/>
  <circle class="fill" cx="50" cy="140" r="3.4"/>
  <circle class="fill" cx="85" cy="128" r="3.4"/>
  <circle class="fill" cx="120" cy="85" r="3.4"/>
  <circle class="fill" cx="145" cy="32" r="3.4"/>
  <text class="txt" x="82" y="158" font-size="12">1</text>
  <text class="txt" x="117" y="158" font-size="12">2</text>
</svg>
