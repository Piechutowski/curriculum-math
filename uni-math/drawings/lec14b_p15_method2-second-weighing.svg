<svg xmlns="http://www.w3.org/2000/svg" width="420" height="180" viewBox="0 0 420 180">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- eye -->
  <path class="ink-thin" d="M 12 60 Q 34 46 56 60 Q 34 74 12 60"/>
  <circle class="fill" cx="34" cy="60" r="4"/>
  <text class="txt" x="34" y="98" font-size="13" text-anchor="middle">eye</text>

  <!-- balanced scale: {coin, Z} vs {coin, D} -->
  <circle class="fill" cx="230" cy="35" r="4"/>
  <path class="ink-thin" d="M 230 35 L 130 95 M 230 35 L 330 95"/>
  <rect class="ink" x="88" y="95" width="84" height="38"/>
  <path class="ink-thin" d="M 130 95 V 133"/>
  <text class="txt" x="151" y="121" font-size="16" text-anchor="middle">Z</text>
  <rect class="ink" x="288" y="95" width="84" height="38"/>
  <path class="ink-thin" d="M 330 95 V 133"/>
  <text class="txt" x="351" y="121" font-size="16" text-anchor="middle">D</text>
</svg>
