<svg xmlns="http://www.w3.org/2000/svg" width="640" height="195" viewBox="0 0 640 195">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    .dotted { stroke-dasharray:2 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="fill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <path class="ink-thin" d="M 20 130 H 180" marker-end="url(#ah)"/>
  <path class="ink-thin" d="M 100 165 V 30" marker-end="url(#ah)"/>
  <path class="ink" d="M 40 60 L 100 130 L 160 60"/>
  <text class="txt" x="128" y="48" font-size="15">y = |x|</text>
  <path class="ink-thin" d="M 240 130 H 400" marker-end="url(#ah)"/>
  <path class="ink-thin" d="M 320 165 V 30" marker-end="url(#ah)"/>
  <circle class="ink" cx="320" cy="130" r="4.5"/>
  <path class="ink" d="M 326 123 L 390 55"/>
  <text class="txt" x="348" y="48" font-size="15">g<tspan dy="4" font-size="11">1</tspan>(x)</text>
  <path class="ink-thin" d="M 460 130 H 620" marker-end="url(#ah)"/>
  <path class="ink-thin" d="M 540 165 V 30" marker-end="url(#ah)"/>
  <circle class="fill" cx="540" cy="130" r="3.6"/>
  <path class="ink" d="M 540 130 L 476 55"/>
  <text class="txt" x="462" y="48" font-size="15">g<tspan dy="4" font-size="11">2</tspan>(x)</text>
</svg>
