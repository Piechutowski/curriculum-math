<svg xmlns="http://www.w3.org/2000/svg" width="360" height="190" viewBox="0 0 360 190">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="fill" cx="4" cy="4" r="1.7"/>
      <circle class="fill" cx="12" cy="12" r="1.7"/>
    </pattern>
    <clipPath id="clipA"><ellipse cx="140" cy="85" rx="95" ry="58"/></clipPath>
  </defs>

  <g clip-path="url(#clipA)"><ellipse cx="215" cy="85" rx="95" ry="58" fill="url(#hatch)"/></g>
  <ellipse class="ink" cx="140" cy="85" rx="95" ry="58"/>
  <ellipse class="ink" cx="215" cy="85" rx="95" ry="58"/>
  <text class="txt" x="80" y="95" font-size="24">|A|</text>
  <text class="txt" x="245" y="95" font-size="24">|B|</text>
  <path class="ink-thin" d="M 178 178 Q 178 160 178 148 M 178 148 l -4.5 9 M 178 148 l 4.5 9"/>
  <text class="txt" x="150" y="188" font-size="17">A ∪ B</text>

</svg>
