<svg xmlns="http://www.w3.org/2000/svg" width="400" height="730" viewBox="0 0 400 730">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- T6: path 5, pendant above and below 4th vertex -->
  <path class="ink" d="M 20 60 L 220 60 M 170 20 L 170 100"/>
  <circle class="fill" cx="20" cy="60" r="5"/><circle class="fill" cx="70" cy="60" r="5"/><circle class="fill" cx="120" cy="60" r="5"/><circle class="fill" cx="170" cy="60" r="5"/><circle class="fill" cx="220" cy="60" r="5"/>
  <circle class="fill" cx="170" cy="20" r="5"/><circle class="fill" cx="170" cy="100" r="5"/>
  <text class="txt" x="300" y="67" font-size="19">T<tspan dy="4" font-size="14">6</tspan></text>

  <!-- T7: path 5, pendant above and below the centre -->
  <path class="ink" d="M 20 160 L 220 160 M 120 120 L 120 200"/>
  <circle class="fill" cx="20" cy="160" r="5"/><circle class="fill" cx="70" cy="160" r="5"/><circle class="fill" cx="120" cy="160" r="5"/><circle class="fill" cx="170" cy="160" r="5"/><circle class="fill" cx="220" cy="160" r="5"/>
  <circle class="fill" cx="120" cy="120" r="5"/><circle class="fill" cx="120" cy="200" r="5"/>
  <text class="txt" x="300" y="167" font-size="19">T<tspan dy="4" font-size="14">7</tspan></text>

  <!-- T8: path 5 + chain of 2 below the centre (spider 2,2,2) -->
  <path class="ink" d="M 20 260 L 220 260 M 120 260 L 120 340"/>
  <circle class="fill" cx="20" cy="260" r="5"/><circle class="fill" cx="70" cy="260" r="5"/><circle class="fill" cx="120" cy="260" r="5"/><circle class="fill" cx="170" cy="260" r="5"/><circle class="fill" cx="220" cy="260" r="5"/>
  <circle class="fill" cx="120" cy="300" r="5"/><circle class="fill" cx="120" cy="340" r="5"/>
  <text class="txt" x="300" y="267" font-size="19">T<tspan dy="4" font-size="14">8</tspan></text>

  <!-- T9: path 4; up+down pendants at 2nd, down pendant at 3rd -->
  <path class="ink" d="M 20 410 L 170 410 M 70 370 L 70 450 M 120 410 L 120 450"/>
  <circle class="fill" cx="20" cy="410" r="5"/><circle class="fill" cx="70" cy="410" r="5"/><circle class="fill" cx="120" cy="410" r="5"/><circle class="fill" cx="170" cy="410" r="5"/>
  <circle class="fill" cx="70" cy="370" r="5"/><circle class="fill" cx="70" cy="450" r="5"/><circle class="fill" cx="120" cy="450" r="5"/>
  <text class="txt" x="300" y="417" font-size="19">T<tspan dy="4" font-size="14">9</tspan></text>

  <!-- T10: centre of degree 5, one arm of length 2 -->
  <path class="ink" d="M 120 545 L 120 498 M 120 545 L 166 516 M 120 545 L 174 562 M 120 545 L 132 592 M 120 545 L 24 545"/>
  <circle class="fill" cx="120" cy="545" r="5"/><circle class="fill" cx="120" cy="498" r="5"/><circle class="fill" cx="166" cy="516" r="5"/><circle class="fill" cx="174" cy="562" r="5"/><circle class="fill" cx="132" cy="592" r="5"/><circle class="fill" cx="72" cy="545" r="5"/><circle class="fill" cx="24" cy="545" r="5"/>
  <text class="txt" x="300" y="552" font-size="19">T<tspan dy="4" font-size="14">10</tspan></text>

  <!-- T11: star K_{1,6} -->
  <path class="ink" d="M 120 660 L 120 612 M 120 660 L 78 636 M 120 660 L 78 684 M 120 660 L 120 708 M 120 660 L 162 684 M 120 660 L 162 636"/>
  <circle class="fill" cx="120" cy="660" r="5"/><circle class="fill" cx="120" cy="612" r="5"/><circle class="fill" cx="78" cy="636" r="5"/><circle class="fill" cx="78" cy="684" r="5"/><circle class="fill" cx="120" cy="708" r="5"/><circle class="fill" cx="162" cy="684" r="5"/><circle class="fill" cx="162" cy="636" r="5"/>
  <text class="txt" x="300" y="667" font-size="19">T<tspan dy="4" font-size="14">11</tspan></text>
</svg>
