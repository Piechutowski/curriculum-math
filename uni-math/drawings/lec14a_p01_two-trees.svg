<svg xmlns="http://www.w3.org/2000/svg" width="470" height="200" viewBox="0 0 470 200">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- a) rooted-looking tree -->
  <text class="txt" x="140" y="28" font-size="19">a)</text>
  <path class="ink" d="M 105 35 L 55 95 M 105 35 L 165 95"/>
  <path class="ink" d="M 55 95 L 15 160 M 55 95 L 55 160 M 55 95 L 95 160"/>
  <path class="ink" d="M 165 95 L 135 160 M 165 95 L 200 160"/>
  <circle class="fill" cx="105" cy="35" r="5"/>
  <circle class="fill" cx="55" cy="95" r="5"/>
  <circle class="fill" cx="165" cy="95" r="5"/>
  <circle class="fill" cx="15" cy="160" r="5"/>
  <circle class="fill" cx="55" cy="160" r="5"/>
  <circle class="fill" cx="95" cy="160" r="5"/>
  <circle class="fill" cx="135" cy="160" r="5"/>
  <circle class="fill" cx="200" cy="160" r="5"/>

  <!-- b) cross-shaped tree -->
  <text class="txt" x="425" y="30" font-size="19">b)</text>
  <path class="ink" d="M 360 25 L 360 175"/>
  <path class="ink" d="M 300 75 L 420 75"/>
  <path class="ink" d="M 300 175 L 420 175"/>
  <circle class="fill" cx="360" cy="25" r="5"/>
  <circle class="fill" cx="360" cy="75" r="5"/>
  <circle class="fill" cx="300" cy="75" r="5"/>
  <circle class="fill" cx="420" cy="75" r="5"/>
  <circle class="fill" cx="360" cy="125" r="5"/>
  <circle class="fill" cx="360" cy="175" r="5"/>
  <circle class="fill" cx="300" cy="175" r="5"/>
  <circle class="fill" cx="420" cy="175" r="5"/>
</svg>
