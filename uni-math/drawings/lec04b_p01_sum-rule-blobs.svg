  <text class="txt" x="115.0" y="116.0" font-size="19">e<tspan dy="5" font-size="13">2</tspan></text>
  <text class="txt" x="228.0" y="84.0" font-size="19">f<tspan dy="5" font-size="13">1</tspan></text>
