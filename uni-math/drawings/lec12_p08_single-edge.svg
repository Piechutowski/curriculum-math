<svg xmlns="http://www.w3.org/2000/svg" width="300" height="110" viewBox="0 0 300 110">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <circle class="ink" cx="70" cy="60" r="14"/>
  <text class="txt" x="70" y="65.5" font-size="16" text-anchor="middle">x<tspan font-size="11" dy="4">1</tspan></text>
  <circle class="ink" cx="230" cy="60" r="14"/>
  <text class="txt" x="230" y="65.5" font-size="16" text-anchor="middle">x<tspan font-size="11" dy="4">2</tspan></text>
  <path class="ink" d="M 86.0 60.0 L 214.0 60.0"/>
  <text class="txt" x="150" y="42" font-size="17" text-anchor="middle">e</text>
</svg>
