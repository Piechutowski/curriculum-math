<svg xmlns="http://www.w3.org/2000/svg" width="520" height="310" viewBox="0 0 520 310">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- axes -->
  <path class="ink-thin" d="M 25 220 H 505 M 505 220 l -10 -5 M 505 220 l -10 5"/>
  <path class="ink-thin" d="M 80 295 V 18 M 80 18 l -5 10 M 80 18 l 5 10"/>

  <!-- x^4 curve -->
  <path class="ink" d="M 80 220 L 110 218.6 L 130 210 L 140 200 L 150 182 L 160 156 L 170 117 L 180 64 L 185 30"/>
  <text class="txt" x="196" y="44" font-size="21">x⁴</text>

  <!-- ln x curve -->
  <path class="ink" d="M 112 264 Q 126 238 140 220 C 170 186 210 166 250 148 C 300 127 400 100 490 86"/>
  <text class="txt" x="462" y="70" font-size="21">ln x</text>

  <!-- sample dots on x^4 -->
  <circle class="fill" cx="150" cy="182" r="4.5"/>
  <circle class="fill" cx="170" cy="117" r="4.5"/>
  <circle class="fill" cx="180" cy="64" r="4.5"/>

  <!-- sample dots on ln x -->
  <circle class="fill" cx="140" cy="220" r="4.5"/>
  <circle class="fill" cx="210" cy="164" r="4.5"/>
  <circle class="fill" cx="280" cy="136" r="4.5"/>

  <!-- ticks n = 1, 2, 3 -->
  <path class="ink-thin" d="M 210 215 V 225 M 280 215 V 225"/>
  <text class="txt" x="128" y="245" font-size="16">n = 1</text>
  <text class="txt" x="198" y="245" font-size="16">n = 2</text>
  <text class="txt" x="268" y="245" font-size="16">n = 3</text>
</svg>
