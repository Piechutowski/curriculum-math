<svg xmlns="http://www.w3.org/2000/svg" width="580" height="470" viewBox="0 0 580 470">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- step 1: all n disks on peg 1 -->
  <g transform="translate(0,6)">
    <text class="txt" x="14" y="60" font-size="19">1.</text>
    <path class="ink" d="M 55 88 H 185"/><path class="ink" d="M 120 88 V 26"/>
    <path class="ink" d="M 250 88 H 350"/><path class="ink" d="M 300 88 V 26"/>
    <path class="ink" d="M 420 88 H 520"/><path class="ink" d="M 470 88 V 26"/>
    <rect class="ink" x="75" y="75" width="90" height="13" rx="3"/>
    <path class="ink" d="M 88 75 L 152 75 L 120 32 Z"/>
    <text class="txt" x="158" y="48" font-size="15">n−1</text>
    <text class="txt" x="176" y="86" font-size="15">n</text>
  </g>

  <!-- step 2: move the top n−1 disks to peg 2, cost T(n−1) -->
  <g transform="translate(0,121)">
    <text class="txt" x="14" y="60" font-size="19">2.</text>
    <path class="ink" d="M 55 88 H 185"/><path class="ink" d="M 120 88 V 26"/>
    <path class="ink" d="M 250 88 H 350"/><path class="ink" d="M 300 88 V 26"/>
    <path class="ink" d="M 420 88 H 520"/><path class="ink" d="M 470 88 V 26"/>
    <rect class="ink" x="75" y="75" width="90" height="13" rx="3"/>
    <path class="ink" d="M 268 88 L 332 88 L 300 45 Z"/>
    <text class="txt" x="338" y="66" font-size="15">n−1</text>
    <path class="ink-thin dashed" d="M 138 40 Q 210 8 278 38"/>
    <path class="ink-thin" d="M 278 38 l -10.5 -3 M 278 38 l -4 -10"/>
    <text class="txt" x="176" y="118" font-size="16">cost T<tspan dy="4" font-size="12">n−1</tspan></text>
  </g>

  <!-- step 3: move the largest disk to peg 3, cost 1 -->
  <g transform="translate(0,236)">
    <text class="txt" x="14" y="60" font-size="19">3.</text>
    <path class="ink" d="M 55 88 H 185"/><path class="ink" d="M 120 88 V 26"/>
    <path class="ink" d="M 250 88 H 350"/><path class="ink" d="M 300 88 V 26"/>
    <path class="ink" d="M 420 88 H 520"/><path class="ink" d="M 470 88 V 26"/>
    <path class="ink" d="M 268 88 L 332 88 L 300 45 Z"/>
    <text class="txt" x="338" y="66" font-size="15">n−1</text>
    <rect class="ink" x="425" y="75" width="90" height="13" rx="3"/>
    <path class="ink-thin dashed" d="M 130 60 Q 300 -2 448 62"/>
    <path class="ink-thin" d="M 448 62 l -10.5 -3.5 M 448 62 l -3 -10.5"/>
    <text class="txt" x="270" y="118" font-size="16">cost 1</text>
  </g>

  <!-- step 4: move the n−1 disks from peg 2 onto peg 3, cost T(n−1) -->
  <g transform="translate(0,351)">
    <text class="txt" x="14" y="60" font-size="19">4.</text>
    <path class="ink" d="M 55 88 H 185"/><path class="ink" d="M 120 88 V 26"/>
    <path class="ink" d="M 250 88 H 350"/><path class="ink" d="M 300 88 V 26"/>
    <path class="ink" d="M 420 88 H 520"/><path class="ink" d="M 470 88 V 26"/>
    <rect class="ink" x="425" y="75" width="90" height="13" rx="3"/>
    <path class="ink" d="M 438 75 L 502 75 L 470 32 Z"/>
    <text class="txt" x="508" y="48" font-size="15">n−1</text>
    <path class="ink-thin dashed" d="M 315 45 Q 385 10 448 40"/>
    <path class="ink-thin" d="M 448 40 l -10.5 -3 M 448 40 l -4 -10"/>
    <text class="txt" x="330" y="118" font-size="16">cost T<tspan dy="4" font-size="12">n−1</tspan></text>
  </g>
</svg>
