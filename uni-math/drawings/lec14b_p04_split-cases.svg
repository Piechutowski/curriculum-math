<svg xmlns="http://www.w3.org/2000/svg" width="720" height="200" viewBox="0 0 720 200">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- a0: nothing left, n-1 right -->
  <g>
    <text class="txt" x="90" y="22" font-size="15" text-anchor="middle">1</text>
    <circle class="fill" cx="90" cy="35" r="4.5"/>
    <path class="ink-thin" d="M 90 35 L 120 75"/>
    <path class="ink" d="M 120 75 L 95 140 L 145 140 Z"/>
    <text class="txt" x="120" y="130" font-size="14" text-anchor="middle">n−1</text>
    <text class="txt" x="90" y="180" font-size="16" text-anchor="middle">a<tspan dy="4" font-size="11">0</tspan></text>
  </g>

  <!-- a1: one node left, n-2 right -->
  <g transform="translate(180,0)">
    <text class="txt" x="90" y="22" font-size="15" text-anchor="middle">1</text>
    <circle class="fill" cx="90" cy="35" r="4.5"/>
    <path class="ink-thin" d="M 90 35 L 60 80 M 90 35 L 120 75"/>
    <circle class="fill" cx="60" cy="80" r="4.5"/>
    <path class="ink" d="M 120 75 L 95 140 L 145 140 Z"/>
    <text class="txt" x="120" y="130" font-size="14" text-anchor="middle">n−2</text>
    <text class="txt" x="90" y="180" font-size="16" text-anchor="middle">a<tspan dy="4" font-size="11">1</tspan></text>
  </g>

  <!-- ak: k left, n-k-1 right -->
  <g transform="translate(360,0)">
    <text class="txt" x="90" y="22" font-size="15" text-anchor="middle">1</text>
    <circle class="fill" cx="90" cy="35" r="4.5"/>
    <path class="ink-thin" d="M 90 35 L 58 75 M 90 35 L 122 75"/>
    <path class="ink" d="M 58 75 L 33 140 L 83 140 Z"/>
    <path class="ink" d="M 122 75 L 97 140 L 147 140 Z"/>
    <text class="txt" x="58" y="130" font-size="14" text-anchor="middle">k</text>
    <text class="txt" x="122" y="130" font-size="12" text-anchor="middle">n−k−1</text>
    <text class="txt" x="90" y="180" font-size="16" text-anchor="middle">a<tspan dy="4" font-size="11">k</tspan></text>
  </g>

  <!-- a(n-1): n-1 left, nothing right -->
  <g transform="translate(540,0)">
    <text class="txt" x="90" y="22" font-size="15" text-anchor="middle">1</text>
    <circle class="fill" cx="90" cy="35" r="4.5"/>
    <path class="ink-thin" d="M 90 35 L 60 75"/>
    <path class="ink" d="M 60 75 L 35 140 L 85 140 Z"/>
    <text class="txt" x="60" y="130" font-size="14" text-anchor="middle">n−1</text>
    <text class="txt" x="90" y="180" font-size="16" text-anchor="middle">a<tspan dy="4" font-size="11">n−1</tspan></text>
  </g>
</svg>
