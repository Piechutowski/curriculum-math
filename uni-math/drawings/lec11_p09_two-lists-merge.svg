<svg xmlns="http://www.w3.org/2000/svg" width="620" height="110" viewBox="0 0 620 110">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- left list L1^(1) : e1 | e2 | ... | en -->
  <text class="txt" x="55" y="26" font-size="19">L<tspan font-size="13" dy="5">1</tspan><tspan font-size="13" dy="-12">(1)</tspan></text>
  <rect class="ink" x="20" y="42" width="270" height="36"/>
  <line class="ink-thin" x1="60" y1="42" x2="60" y2="78"/>
  <line class="ink-thin" x1="100" y1="42" x2="100" y2="78"/>
  <line class="ink-thin" x1="250" y1="42" x2="250" y2="78"/>
  <text class="txt" x="40" y="67" font-size="18" text-anchor="middle">e<tspan font-size="13" dy="4">1</tspan></text>
  <text class="txt" x="80" y="67" font-size="18" text-anchor="middle">e<tspan font-size="13" dy="4">2</tspan></text>
  <text class="txt" x="175" y="65" font-size="18" text-anchor="middle">&#8230;</text>
  <text class="txt" x="270" y="67" font-size="18" text-anchor="middle">e<tspan font-size="13" dy="4">n</tspan></text>

  <!-- right list L2^(1) : f1 | f2 | ... | fn -->
  <text class="txt" x="375" y="26" font-size="19">L<tspan font-size="13" dy="5">2</tspan><tspan font-size="13" dy="-12">(1)</tspan></text>
  <rect class="ink" x="340" y="42" width="270" height="36"/>
  <line class="ink-thin" x1="380" y1="42" x2="380" y2="78"/>
  <line class="ink-thin" x1="420" y1="42" x2="420" y2="78"/>
  <line class="ink-thin" x1="570" y1="42" x2="570" y2="78"/>
  <text class="txt" x="360" y="67" font-size="18" text-anchor="middle">f<tspan font-size="13" dy="4">1</tspan></text>
  <text class="txt" x="400" y="67" font-size="18" text-anchor="middle">f<tspan font-size="13" dy="4">2</tspan></text>
  <text class="txt" x="495" y="65" font-size="18" text-anchor="middle">&#8230;</text>
  <text class="txt" x="590" y="67" font-size="18" text-anchor="middle">f<tspan font-size="13" dy="4">n</tspan></text>
</svg>
