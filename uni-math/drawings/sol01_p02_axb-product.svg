<svg xmlns="http://www.w3.org/2000/svg" width="560" height="400" viewBox="0 0 560 400">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
  </defs>

  <text class="txt" x="36" y="86" font-size="24">A × B</text>

  <!-- axes -->
  <path class="ink-thin" d="M 70 290 H 510 M 510 290 l -10 -5 M 510 290 l -10 5"/>
  <path class="ink-thin" d="M 290 370 V 50 M 290 50 l -5 10 M 290 50 l 5 10"/>
  <text class="txt" x="502" y="322" font-size="20">x</text>
  <text class="txt" x="268" y="57" font-size="20">y</text>
  <text class="txt" x="398" y="268" font-size="14">here we have the set A</text>
  <text class="txt" x="306" y="70" font-size="14">here we have the set B</text>

  <!-- hatched rectangle (-1/2, 2/3] x [0,1) -->
  <rect x="220" y="150" width="163" height="140" fill="url(#hatch)"/>
  <path class="ink dashed" d="M 220 150 V 290"/>
  <path class="ink" d="M 383 150 V 290"/>
  <path class="ink" d="M 226 290 H 383" stroke-width="4"/>
  <path class="ink dashed" d="M 220 150 H 383"/>
  <circle class="ink" cx="220" cy="150" r="5"/>
  <circle class="ink" cx="220" cy="290" r="5"/>
  <circle class="ink" cx="383" cy="150" r="5"/>
  <circle class="fill" cx="383" cy="290" r="5"/>

  <!-- segment {-1} x [0,1) -->
  <path class="ink" d="M 150 284 V 156" stroke-width="4"/>
  <circle class="fill" cx="150" cy="290" r="5"/>
  <circle class="ink" cx="150" cy="150" r="5"/>

  <!-- tick labels -->
  <text class="txt" x="140" y="320" font-size="18">−1</text>
  <text class="txt" x="200" y="320" font-size="18">−1/2</text>
  <text class="txt" x="372" y="320" font-size="18">2/3</text>
  <text class="txt" x="266" y="142" font-size="18">1</text>
</svg>
