<svg xmlns="http://www.w3.org/2000/svg" width="560" height="420" viewBox="0 0 560 420">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
  </defs>

  <text class="txt" x="36" y="96" font-size="24">B × A</text>

  <!-- axes -->
  <path class="ink-thin" d="M 70 190 H 500 M 500 190 l -10 -5 M 500 190 l -10 5"/>
  <path class="ink-thin" d="M 180 390 V 45 M 180 45 l -5 10 M 180 45 l 5 10"/>
  <text class="txt" x="492" y="182" font-size="20">x</text>
  <text class="txt" x="158" y="52" font-size="20">y</text>
  <text class="txt" x="352" y="172" font-size="14">here we have the set B</text>
  <text class="txt" x="196" y="64" font-size="14">here we have the set A</text>

  <!-- hatched rectangle [0,1) x (-1/2, 2/3] -->
  <rect x="180" y="103" width="150" height="152" fill="url(#hatch)"/>
  <path class="ink" d="M 180 103 V 255" stroke-width="4"/>
  <path class="ink" d="M 180 103 H 330"/>
  <path class="ink dashed" d="M 330 103 V 255"/>
  <path class="ink dashed" d="M 180 255 H 330"/>
  <circle class="fill" cx="180" cy="103" r="5"/>
  <circle class="ink" cx="330" cy="103" r="5"/>
  <circle class="ink" cx="180" cy="255" r="5"/>
  <circle class="ink" cx="330" cy="255" r="5"/>

  <!-- segment [0,1) x {-1} -->
  <path class="ink" d="M 186 320 H 324" stroke-width="4"/>
  <circle class="fill" cx="180" cy="320" r="5"/>
  <circle class="ink" cx="330" cy="320" r="5"/>

  <!-- tick labels -->
  <text class="txt" x="142" y="110" font-size="18">2/3</text>
  <text class="txt" x="128" y="262" font-size="18">−1/2</text>
  <text class="txt" x="140" y="327" font-size="18">−1</text>
  <text class="txt" x="338" y="212" font-size="18">1</text>
</svg>
