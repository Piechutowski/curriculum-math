<svg xmlns="http://www.w3.org/2000/svg" width="220" height="300" viewBox="0 0 220 300">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="fill" cx="4" cy="4" r="1.7"/>
      <circle class="fill" cx="12" cy="12" r="1.7"/>
    </pattern>
    <clipPath id="clipL"><circle cx="90" cy="235" r="40"/></clipPath>
  </defs>

  <circle class="ink" cx="80" cy="60" r="42" style="fill:url(#dots)"/>
  <circle class="ink" cx="130" cy="85" r="42" style="fill:url(#dots)"/>
  <circle class="ink" cx="85" cy="110" r="42" style="fill:url(#dots)"/>
  <text class="txt" x="45" y="185" font-size="16">union</text>
  <circle class="ink" cx="90" cy="235" r="40"/>
  <circle class="ink" cx="130" cy="235" r="40"/>
  <g clip-path="url(#clipL)"><circle cx="130" cy="235" r="40" fill="url(#hatch)"/></g>
  <text class="txt" x="35" y="295" font-size="16">intersection</text>

</svg>
