<svg xmlns="http://www.w3.org/2000/svg" width="430" height="205" viewBox="0 0 430 205">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="fill" cx="4" cy="4" r="1.7"/>
      <circle class="fill" cx="12" cy="12" r="1.7"/>
    </pattern>
  </defs>

  <rect class="ink" x="20" y="30" width="390" height="145" rx="10"/>
  <rect class="ink-thin" x="30" y="38" width="240" height="36"/>
  <line class="ink-thin" x1="90" y1="38" x2="90" y2="74"/>
  <line class="ink-thin" x1="150" y1="38" x2="150" y2="74"/>
  <line class="ink-thin" x1="210" y1="38" x2="210" y2="74"/>
  <text class="txt" x="60" y="62" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">5</tspan></text>
  <text class="txt" x="120" y="62" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">6</tspan></text>
  <text class="txt" x="180" y="62" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">7</tspan></text>
  <text class="txt" x="240" y="62" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">8</tspan></text>
  <rect class="ink-thin" x="30" y="131" width="240" height="36"/>
  <line class="ink-thin" x1="90" y1="131" x2="90" y2="167"/>
  <line class="ink-thin" x1="150" y1="131" x2="150" y2="167"/>
  <line class="ink-thin" x1="210" y1="131" x2="210" y2="167"/>
  <text class="txt" x="60" y="155" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">1</tspan></text>
  <text class="txt" x="120" y="155" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">2</tspan></text>
  <text class="txt" x="180" y="155" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">3</tspan></text>
  <text class="txt" x="240" y="155" font-size="15" text-anchor="middle">m<tspan font-size="11" dy="3">4</tspan></text>
  <text class="txt" x="112" y="98" font-size="17">b<tspan font-size="12" dy="3">1</tspan></text>
  <text class="txt" x="48" y="120" font-size="17">b<tspan font-size="12" dy="3">2</tspan></text>
  <text class="txt" x="232" y="118" font-size="17">b<tspan font-size="12" dy="3">3</tspan></text>
</svg>
