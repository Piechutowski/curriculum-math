<svg xmlns="http://www.w3.org/2000/svg" width="720" height="305" viewBox="0 0 720 305">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- ================= Circle 1 : 2n people ================= -->
  <circle class="ink-thin" cx="160" cy="150" r="95" stroke-dasharray="1.5 7"/>
  <!-- dots -->
  <circle class="fill" cx="160" cy="55" r="3.6"/>
  <circle class="fill" cx="211.8" cy="70.3" r="3.6"/>
  <circle class="fill" cx="246.8" cy="111.3" r="3.6"/>
  <circle class="fill" cx="253.8" cy="164.9" r="3.6"/>
  <circle class="fill" cx="236.9" cy="205.8" r="3.6"/>
  <circle class="fill" cx="166.6" cy="244.8" r="3.6"/>
  <circle class="fill" cx="127.5" cy="239.3" r="3.6"/>
  <circle class="fill" cx="94.0" cy="218.3" r="3.6"/>
  <circle class="fill" cx="65.1" cy="146.7" r="3.6"/>
  <circle class="fill" cx="73.9" cy="109.8" r="3.6"/>
  <circle class="fill" cx="96.4" cy="79.4" r="3.6"/>
  <circle class="fill" cx="127.5" cy="60.7" r="3.6"/>
  <!-- labels -->
  <text class="txt" x="160" y="40" font-size="16" text-anchor="middle">1</text>
  <text class="txt" x="224.7" y="58.5" font-size="16" text-anchor="middle">2</text>
  <text class="txt" x="267.1" y="108.2" font-size="16" text-anchor="middle">3</text>
  <text class="txt" x="275.6" y="173.0" font-size="16" text-anchor="middle">4</text>
  <text class="txt" x="255.0" y="222.6" font-size="16" text-anchor="middle">5</text>
  <text class="txt" x="216.0" y="256.5" font-size="16" text-anchor="middle">&#8230;</text>
  <text class="txt" x="168.0" y="271.7" font-size="15" text-anchor="middle">n+1</text>
  <text class="txt" x="118.7" y="263.1" font-size="15" text-anchor="middle">n</text>
  <text class="txt" x="76.1" y="239.7" font-size="15" text-anchor="middle">n&#8722;1</text>
  <text class="txt" x="50.0" y="194.3" font-size="16" text-anchor="middle">&#8942;</text>
  <text class="txt" x="42.1" y="151.0" font-size="15" text-anchor="middle">2n&#8722;3</text>
  <text class="txt" x="52.8" y="106.4" font-size="15" text-anchor="middle">2n&#8722;2</text>
  <text class="txt" x="80.1" y="69.6" font-size="15" text-anchor="middle">2n&#8722;1</text>
  <text class="txt" x="120.7" y="47.0" font-size="15" text-anchor="middle">2n</text>
  <!-- start-of-count arrow inside -->
  <path class="ink-thin" d="M 160 118 V 72 M 160 72 l -4.5 9 M 160 72 l 4.5 9"/>
  <text class="txt" x="160" y="140" font-size="13" text-anchor="middle">start</text>
  <text class="txt" x="160" y="288" font-size="17" text-anchor="middle">Circle 1 &#8212; 2n elements</text>

  <!-- ================= middle arrow ================= -->
  <path class="ink-thin" d="M 290 145 H 420 M 420 145 l -10 -5 M 420 145 l -10 5"/>
  <text class="txt" x="355" y="112" font-size="16" text-anchor="middle">1st elimination</text>
  <text class="txt" x="355" y="131" font-size="16" text-anchor="middle">cycle</text>

  <!-- ================= Circle 2 : n survivors ================= -->
  <circle class="ink-thin" cx="545" cy="150" r="95" stroke-dasharray="1.5 7"/>
  <!-- dots -->
  <circle class="fill" cx="545" cy="55" r="3.6"/>
  <circle class="fill" cx="618.8" cy="90.2" r="3.6"/>
  <circle class="fill" cx="637.5" cy="171.4" r="3.6"/>
  <circle class="fill" cx="452.5" cy="171.4" r="3.6"/>
  <circle class="fill" cx="471.2" cy="90.2" r="3.6"/>
  <!-- labels (old numbers) -->
  <text class="txt" x="545" y="40" font-size="16" text-anchor="middle">1</text>
  <text class="txt" x="634.4" y="83" font-size="16" text-anchor="middle">3</text>
  <text class="txt" x="657.0" y="181" font-size="16" text-anchor="middle">5</text>
  <text class="txt" x="593.6" y="254.2" font-size="16" text-anchor="middle">&#8230;</text>
  <text class="txt" x="429.0" y="181" font-size="15" text-anchor="middle">2n&#8722;3</text>
  <text class="txt" x="453.6" y="79" font-size="15" text-anchor="middle">2n&#8722;1</text>
  <!-- new (tilde) indices inside, with pointers -->
  <text class="txt" x="540" y="112" font-size="15" text-anchor="middle">1</text>
  <path class="ink-thin" d="M 534.5 97 q 2.5 -3.5 5 -1 q 2.5 2.5 5.5 -1" stroke-width="1.2"/>
  <path class="ink-thin" d="M 545 98 L 545 68 M 545 68 l -3.5 7 M 545 68 l 3.5 7"/>
  <text class="txt" x="592" y="122" font-size="15" text-anchor="middle">2</text>
  <path class="ink-thin" d="M 586.5 108 q 2.5 -3.5 5 -1 q 2.5 2.5 5.5 -1" stroke-width="1.2"/>
  <path class="ink-thin" d="M 599 112 L 612 99 M 612 99 l -7.5 2.5 M 612 99 l -2.5 7.5"/>
  <text class="txt" x="602" y="163" font-size="15" text-anchor="middle">3</text>
  <path class="ink-thin" d="M 596.5 149 q 2.5 -3.5 5 -1 q 2.5 2.5 5.5 -1" stroke-width="1.2"/>
  <path class="ink-thin" d="M 612 162 L 628 168 M 628 168 l -7.5 -3 M 628 168 l -7 3.5"/>
  <text class="txt" x="490" y="167" font-size="15" text-anchor="middle">n&#771;&#8722;1</text>
  <path class="ink-thin" d="M 478 169 L 462 171 M 462 171 l 8 2.5 M 462 171 l 7.5 -3.5"/>
  <text class="txt" x="496" y="119" font-size="15" text-anchor="middle">n&#771;</text>
  <path class="ink-thin" d="M 489 108 L 478 96 M 478 96 l 2.5 8 M 478 96 l 8 3"/>
  <text class="txt" x="545" y="288" font-size="17" text-anchor="middle">Circle 2 &#8212; n elements</text>
</svg>
