<svg xmlns="http://www.w3.org/2000/svg" width="460" height="360" viewBox="0 0 460 360">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
    <mask id="mBA">
      <rect x="-20" y="-20" width="500" height="400" fill="white"/>
      <circle cx="170" cy="180" r="75" fill="black"/>
    </mask>
  </defs>

  <!-- right half-plane minus the closed half-disc -->
  <g mask="url(#mBA)"><rect x="170" y="50" width="240" height="260" fill="url(#hatch)"/></g>
  <path class="ink dashed" d="M 170 105 A 75 75 0 0 1 170 255"/>
  <circle class="ink" cx="170" cy="105" r="5"/>
  <circle class="ink" cx="170" cy="255" r="5"/>

  <!-- axes: y-axis included only for |y| > 1 -->
  <path class="ink-thin" d="M 60 180 H 430 M 430 180 l -10 -5 M 430 180 l -10 5"/>
  <path class="ink-thin" d="M 170 330 V 32 M 170 32 l -5 10 M 170 32 l 5 10"/>
  <path class="ink" d="M 170 98 V 38" stroke-width="4"/>
  <path class="ink" d="M 170 262 V 324" stroke-width="4"/>
  <text class="txt" x="420" y="206" font-size="18">x</text>
  <text class="txt" x="146" y="42" font-size="18">y</text>

  <text class="txt" x="330" y="72" font-size="22">B ∖ A</text>
</svg>
