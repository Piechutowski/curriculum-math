<svg xmlns="http://www.w3.org/2000/svg" width="440" height="150" viewBox="0 0 440 150">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- m objects -->
  <circle class="fill" cx="50" cy="70" r="3.2"/>
  <circle class="fill" cx="75" cy="55" r="3.2"/>
  <circle class="fill" cx="100" cy="75" r="3.2"/>
  <circle class="fill" cx="70" cy="95" r="3.2"/>
  <circle class="fill" cx="95" cy="110" r="3.2"/>
  <circle class="fill" cx="120" cy="60" r="3.2"/>
  <text class="txt" x="85" y="137" font-size="16" text-anchor="middle">m objects</text>

  <!-- arrow -->
  <path class="ink-thin" d="M 150 82 H 240 M 240 82 l -9 -4.5 M 240 82 l -9 4.5"/>
  <text class="txt" x="195" y="68" font-size="15" text-anchor="middle">place into</text>

  <!-- n boxes -->
  <rect class="ink" x="260" y="62" width="38" height="38"/>
  <text class="txt" x="279" y="88" font-size="17" text-anchor="middle">1</text>
  <text class="txt" x="321" y="88" font-size="17" text-anchor="middle">&#8230;</text>
  <rect class="ink" x="344" y="62" width="38" height="38"/>
  <text class="txt" x="363" y="88" font-size="17" text-anchor="middle">n</text>
  <text class="txt" x="330" y="137" font-size="16" text-anchor="middle">n boxes</text>
</svg>
