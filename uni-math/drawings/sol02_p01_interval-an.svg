  <circle class="ink" cx="205" cy="40" r="6"/>
  <text class="txt" x="114" y="72" font-size="18">0</text>
  <text class="txt" x="192" y="72" font-size="16">2/n</text>
  <text class="txt" x="442" y="47" font-size="20">A<tspan font-size="14" dy="4">n</tspan></text>
</svg>
