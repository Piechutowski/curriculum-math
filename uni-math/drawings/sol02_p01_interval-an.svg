<svg xmlns="http://www.w3.org/2000/svg" width="480" height="95" viewBox="0 0 480 95">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    .seg { stroke:#d8d8d8; fill:none; stroke-width:5; stroke-linecap:round; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin, .seg { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <path class="ink-thin" d="M 40 40 H 425 M 425 40 l -9 -4.5 M 425 40 l -9 4.5"/>
