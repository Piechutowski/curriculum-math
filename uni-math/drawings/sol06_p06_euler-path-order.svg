<svg xmlns="http://www.w3.org/2000/svg" width="430" height="235" viewBox="0 0 430 235">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- dotted traversal, edges numbered 1..5 -->
  <line class="ink-thin dashed" x1="80" y1="60" x2="120" y2="180"/>
  <line class="ink-thin dashed" x1="120" y1="180" x2="240" y2="180"/>
  <line class="ink-thin dashed" x1="240" y1="180" x2="320" y2="60"/>
  <line class="ink-thin dashed" x1="320" y1="60" x2="200" y2="60"/>
  <line class="ink-thin dashed" x1="200" y1="60" x2="120" y2="180"/>

  <!-- vertices (open circles, doodle style) -->
  <circle class="ink-thin" cx="80" cy="60" r="4.5"/>
  <circle class="ink-thin" cx="200" cy="60" r="4.5"/>
  <circle class="ink-thin" cx="320" cy="60" r="4.5"/>
  <circle class="ink-thin" cx="120" cy="180" r="4.5"/>
  <circle class="ink-thin" cx="240" cy="180" r="4.5"/>

  <!-- edge numbers -->
  <text class="txt" x="82" y="128" font-size="18">1</text>
  <text class="txt" x="176" y="204" font-size="18">2</text>
  <text class="txt" x="294" y="128" font-size="18">3</text>
  <text class="txt" x="256" y="48" font-size="18">4</text>
  <text class="txt" x="172" y="114" font-size="18">5</text>
</svg>
