  <path class="ink" d="M 82 178 C 86 145 100 124 120 115 C 152 101 195 93 228 88"/>
  <text class="txt" x="180" y="26" font-size="16">y = x</text>
  <text class="txt" x="150" y="80" font-size="16">y = lg x</text>
</svg>
