<svg xmlns="http://www.w3.org/2000/svg" width="660" height="240" viewBox="0 0 660 240">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- first weighing: triple vs triple -->
  <circle class="fill" cx="190" cy="35" r="4"/>
  <path class="ink-thin" d="M 190 35 L 80 95 M 190 35 L 300 95"/>
  <rect class="ink" x="23" y="95" width="114" height="40"/>
  <path class="ink-thin" d="M 61 95 V 135 M 99 95 V 135"/>
  <rect class="ink" x="243" y="95" width="114" height="40"/>
  <path class="ink-thin" d="M 281 95 V 135 M 319 95 V 135"/>
  <text class="txt" x="190" y="180" font-size="15" text-anchor="middle">if the triples balance,</text>
  <text class="txt" x="190" y="200" font-size="15" text-anchor="middle">the 2nd weighing decides</text>

  <!-- arrow to the second weighing of the leftover pair -->
  <path class="ink-thin" d="M 390 165 Q 430 135 458 112 M 458 112 l -9.5 2 M 458 112 l -3 9.5"/>

  <!-- second weighing: the two remaining coins -->
  <circle class="fill" cx="540" cy="70" r="4"/>
  <path class="ink-thin" d="M 540 70 L 490 115 M 540 70 L 590 115"/>
  <rect class="ink" x="472" y="115" width="36" height="32"/>
  <rect class="ink" x="572" y="115" width="36" height="32"/>
  <text class="txt" x="540" y="180" font-size="14" text-anchor="middle">the remaining 2 coins</text>
</svg>
