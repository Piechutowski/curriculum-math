<svg xmlns="http://www.w3.org/2000/svg" width="430" height="235" viewBox="0 0 430 235">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- edges: pendant A-D and parallelogram D-B-C-E-D -->
  <line class="ink" x1="80" y1="60" x2="120" y2="180"/>
  <line class="ink" x1="120" y1="180" x2="200" y2="60"/>
  <line class="ink" x1="200" y1="60" x2="320" y2="60"/>
  <line class="ink" x1="320" y1="60" x2="240" y2="180"/>
  <line class="ink" x1="240" y1="180" x2="120" y2="180"/>

  <!-- vertices -->
  <circle class="fill" cx="80" cy="60" r="5"/>
  <circle class="fill" cx="200" cy="60" r="5"/>
  <circle class="fill" cx="320" cy="60" r="5"/>
  <circle class="fill" cx="120" cy="180" r="5"/>
  <circle class="fill" cx="240" cy="180" r="5"/>

  <!-- degree labels -->
  <text class="txt" x="80" y="40" font-size="17" text-anchor="middle">deg = 1</text>
  <text class="txt" x="200" y="40" font-size="17" text-anchor="middle">deg = 2</text>
  <text class="txt" x="320" y="40" font-size="17" text-anchor="middle">deg = 2</text>
  <text class="txt" x="112" y="212" font-size="17" text-anchor="middle">deg = 3</text>
  <text class="txt" x="248" y="212" font-size="17" text-anchor="middle">deg = 2</text>

  <text class="txt" x="368" y="128" font-size="22">G</text>
  <text class="txt" x="384" y="134" font-size="15">1</text>
</svg>
