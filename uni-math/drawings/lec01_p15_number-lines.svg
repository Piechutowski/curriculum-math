<svg xmlns="http://www.w3.org/2000/svg" width="520" height="230" viewBox="0 0 520 230">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="fill" cx="4" cy="4" r="1.7"/>
      <circle class="fill" cx="12" cy="12" r="1.7"/>
    </pattern>
    
  </defs>

  <text class="txt" x="30" y="60" font-size="22">A</text>
  <path class="ink-thin" d="M 60 70 H 490 M 490 70 l -10 -5 M 490 70 l -10 5"/>
  <path class="ink" d="M 155 70 H 330" stroke-width="4"/>
  <circle class="ink" cx="150" cy="70" r="6" style="fill:#00000000"/>
  <circle class="fill" cx="330" cy="70" r="6"/>
  <text class="txt" x="145" y="100" font-size="20">0</text>
  <text class="txt" x="325" y="100" font-size="20">2</text>

  <text class="txt" x="30" y="160" font-size="22">B</text>
  <path class="ink-thin" d="M 60 170 H 490 M 490 170 l -10 -5 M 490 170 l -10 5"/>
  <circle class="fill" cx="90" cy="170" r="6"/>
  <path class="ink" d="M 240 170 H 415" stroke-width="4"/>
  <circle class="fill" cx="240" cy="170" r="6"/>
  <circle class="ink" cx="420" cy="170" r="6" style="fill:#00000000"/>
  <text class="txt" x="82" y="200" font-size="20">−1</text>
  <text class="txt" x="145" y="200" font-size="20">0</text>
  <path class="ink-thin" d="M 150 165 V 175"/>
  <text class="txt" x="235" y="200" font-size="20">1</text>
  <text class="txt" x="325" y="200" font-size="20">2</text>
  <path class="ink-thin" d="M 330 165 V 175"/>
  <text class="txt" x="415" y="200" font-size="20">3</text>

</svg>
