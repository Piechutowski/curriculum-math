  <line class="ink" x1="369.4" y1="99.2" x2="170.6" y2="270.8"/>
  <line class="ink" x1="174.0" y1="280.0" x2="316.0" y2="280.0"/>
  <path class="ink" d="M 341.3 288.2 A 26 26 0 1 0 341.3 271.8"/>
  <circle class="ink" cx="160.0" cy="90.0" r="14"/>
  <text class="txt" x="160.0" y="95.5" font-size="15" text-anchor="middle">u</text>
  <circle class="ink" cx="380.0" cy="90.0" r="14"/>
  <text class="txt" x="380.0" y="95.5" font-size="15" text-anchor="middle">v</text>
