<svg xmlns="http://www.w3.org/2000/svg" width="320" height="285" viewBox="0 0 320 285">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <pattern id="hatch" width="8" height="8" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
      <line class="hl" x1="0" y1="0" x2="0" y2="8" stroke-width="1.6"/>
    </pattern>
    <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
      <circle class="fill" cx="4" cy="4" r="1.7"/>
      <circle class="fill" cx="12" cy="12" r="1.7"/>
    </pattern>
  </defs>

  <rect class="ink" x="60" y="50" width="200" height="180"/>
  <rect class="ink" x="125" y="105" width="70" height="70"/>
  <circle class="fill" cx="60.0" cy="50.0" r="5"/>
  <circle class="fill" cx="260.0" cy="50.0" r="5"/>
  <circle class="fill" cx="260.0" cy="230.0" r="5"/>
  <circle class="fill" cx="60.0" cy="230.0" r="5"/>
  <circle class="fill" cx="125.0" cy="105.0" r="5"/>
  <circle class="fill" cx="195.0" cy="105.0" r="5"/>
  <circle class="fill" cx="195.0" cy="175.0" r="5"/>
  <circle class="fill" cx="125.0" cy="175.0" r="5"/>
  <text class="txt" x="152" y="265" font-size="20">G</text>

</svg>
