<svg xmlns="http://www.w3.org/2000/svg" width="470" height="315" viewBox="0 0 470 315">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- the walk, in order: 1: P1->P2, 2: P2->P4, 3: P4->z, 4: z->P1, 5: P1->P3, 6: P3->P4 -->
  <line class="ink-thin dashed" x1="238" y1="80" x2="390" y2="80"/>
  <path class="ink-thin" d="M 390 80 L 379.1 74.9 M 390 80 L 379.1 85.1"/>
  <line class="ink-thin dashed" x1="400" y1="90" x2="400" y2="228"/>
  <path class="ink-thin" d="M 400 228 L 405.1 217.1 M 400 228 L 394.9 217.1"/>
  <path class="ink-thin dashed" d="M 392 250 Q 220 320 78 172"/>
  <path class="ink-thin" d="M 78 172 L 81.9 183.4 M 78 172 L 89.2 176.3"/>
  <path class="ink-thin dashed" d="M 78 148 Q 140 70 218 82"/>
  <path class="ink-thin" d="M 218 82 L 208 75.3 M 218 82 L 206.5 85.4"/>
  <line class="ink-thin dashed" x1="230" y1="92" x2="230" y2="228"/>
  <path class="ink-thin" d="M 230 228 L 235.1 217.1 M 230 228 L 224.9 217.1"/>
  <line class="ink-thin dashed" x1="240" y1="240" x2="390" y2="240"/>
  <path class="ink-thin" d="M 390 240 L 379.1 234.9 M 390 240 L 379.1 245.1"/>

  <!-- step numbers -->
  <text class="txt" x="312" y="70" font-size="17">1</text>
  <text class="txt" x="414" y="164" font-size="17">2</text>
  <text class="txt" x="216" y="296" font-size="17">3</text>
  <text class="txt" x="134" y="74" font-size="17">4</text>
  <text class="txt" x="210" y="166" font-size="17">5</text>
  <text class="txt" x="312" y="228" font-size="17">6</text>

  <!-- vertices -->
  <circle class="fill" cx="70" cy="160" r="5"/>
  <circle class="fill" cx="230" cy="80" r="5"/>
  <circle class="fill" cx="400" cy="80" r="5"/>
  <circle class="fill" cx="230" cy="240" r="5"/>
  <circle class="fill" cx="400" cy="240" r="5"/>
  <text class="txt" x="44" y="166" font-size="17">z</text>
  <text class="txt" x="216" y="58" font-size="17">P</text>
  <text class="txt" x="227" y="62" font-size="12">1</text>
  <text class="txt" x="404" y="58" font-size="17">P</text>
  <text class="txt" x="415" y="62" font-size="12">2</text>
  <text class="txt" x="184" y="236" font-size="17">P</text>
  <text class="txt" x="195" y="240" font-size="12">3</text>
  <text class="txt" x="404" y="266" font-size="17">P</text>
  <text class="txt" x="415" y="270" font-size="12">4</text>

  <text class="txt" x="146" y="40" font-size="17">start</text>
  <text class="txt" x="424" y="292" font-size="17">end</text>
</svg>
