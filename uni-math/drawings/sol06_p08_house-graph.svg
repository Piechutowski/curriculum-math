<svg xmlns="http://www.w3.org/2000/svg" width="470" height="315" viewBox="0 0 470 315">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- edges -->
  <path class="ink" d="M 78 148 Q 140 70 214 84"/>          <!-- d1: z-P1 -->
  <path class="ink" d="M 76 173 Q 200 320 389 251"/>        <!-- d6: z-P4 -->
  <line class="ink" x1="230" y1="96" x2="230" y2="224"/>    <!-- d3: P1-P3 -->
  <line class="ink" x1="246" y1="80" x2="384" y2="80"/>     <!-- d2: P1-P2 -->
  <line class="ink" x1="400" y1="96" x2="400" y2="224"/>    <!-- d4: P2-P4 -->
  <line class="ink" x1="246" y1="240" x2="384" y2="240"/>   <!-- d5: P3-P4 -->

  <!-- vertices -->
  <circle class="ink" cx="70" cy="160" r="14"/>
  <circle class="ink" cx="230" cy="80" r="16"/>
  <circle class="ink" cx="400" cy="80" r="16"/>
  <circle class="ink" cx="230" cy="240" r="16"/>
  <circle class="ink" cx="400" cy="240" r="16"/>
  <text class="txt" x="70" y="166" font-size="18" text-anchor="middle">z</text>
  <text class="txt" x="221" y="86" font-size="17">P</text>
  <text class="txt" x="232" y="90" font-size="12">1</text>
  <text class="txt" x="391" y="86" font-size="17">P</text>
  <text class="txt" x="402" y="90" font-size="12">2</text>
  <text class="txt" x="221" y="246" font-size="17">P</text>
  <text class="txt" x="232" y="250" font-size="12">3</text>
  <text class="txt" x="391" y="246" font-size="17">P</text>
  <text class="txt" x="402" y="250" font-size="12">4</text>

  <!-- edge labels (with macrons and subscripts) -->
  <text class="txt" x="118" y="76" font-size="18">d</text>
  <line class="ink-thin" x1="117" y1="61" x2="128" y2="61"/>
  <text class="txt" x="128" y="80" font-size="12">1</text>
  <text class="txt" x="308" y="66" font-size="18">d</text>
  <line class="ink-thin" x1="307" y1="51" x2="318" y2="51"/>
  <text class="txt" x="318" y="70" font-size="12">2</text>
  <text class="txt" x="196" y="166" font-size="18">d</text>
  <line class="ink-thin" x1="195" y1="151" x2="206" y2="151"/>
  <text class="txt" x="206" y="170" font-size="12">3</text>
  <text class="txt" x="420" y="166" font-size="18">d</text>
  <line class="ink-thin" x1="419" y1="151" x2="430" y2="151"/>
  <text class="txt" x="430" y="170" font-size="12">4</text>
  <text class="txt" x="300" y="230" font-size="18">d</text>
  <line class="ink-thin" x1="299" y1="215" x2="310" y2="215"/>
  <text class="txt" x="310" y="234" font-size="12">5</text>
  <text class="txt" x="206" y="302" font-size="18">d</text>
  <line class="ink-thin" x1="205" y1="287" x2="216" y2="287"/>
  <text class="txt" x="216" y="306" font-size="12">6</text>
</svg>
