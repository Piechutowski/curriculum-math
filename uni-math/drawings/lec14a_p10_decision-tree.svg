<svg xmlns="http://www.w3.org/2000/svg" width="720" height="370" viewBox="0 0 720 370">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>

  <!-- root -->
  <rect class="ink" x="290" y="20" width="140" height="32"/>
  <text class="txt" x="360" y="42" font-size="16" text-anchor="middle">temperature</text>
  <!-- annotation: distinguished root -->
  <text class="txt" x="548" y="33" font-size="15">distinguished root</text>
  <path class="ink-thin" d="M 540 28 L 442 30 M 442 30 l 11 -4 M 442 30 l 11 5"/>

  <!-- edges root -> pulse -->
  <path class="ink-thin" d="M 360 52 L 150 105 M 360 52 L 360 105 M 360 52 L 570 105"/>
  <text class="txt" x="215" y="72" font-size="15">high</text>
  <text class="txt" x="483" y="72" font-size="15">low</text>

  <!-- pulse boxes -->
  <rect class="ink" x="105" y="105" width="90" height="30"/>
  <text class="txt" x="150" y="126" font-size="16" text-anchor="middle">pulse</text>
  <rect class="ink" x="315" y="105" width="90" height="30"/>
  <text class="txt" x="360" y="126" font-size="16" text-anchor="middle">pulse</text>
  <rect class="ink" x="525" y="105" width="90" height="30"/>
  <text class="txt" x="570" y="126" font-size="16" text-anchor="middle">pulse</text>

  <!-- pulse 1 children -->
  <path class="ink-thin" d="M 150 135 L 85 178 M 150 135 L 195 178"/>
  <text class="txt" x="80" y="160" font-size="15" text-anchor="middle">weak</text>
  <text class="txt" x="200" y="160" font-size="15" text-anchor="middle">strong</text>
  <ellipse class="ink" cx="85" cy="195" rx="40" ry="17"/>
  <text class="txt" x="85" y="200" font-size="15" text-anchor="middle">flu</text>
  <ellipse class="ink" cx="195" cy="195" rx="42" ry="17"/>
  <text class="txt" x="195" y="200" font-size="15" text-anchor="middle">plague</text>

  <!-- pulse 2 children -->
  <path class="ink-thin" d="M 360 135 L 305 178 M 360 135 L 413 178"/>
  <text class="txt" x="303" y="160" font-size="15" text-anchor="middle">weak</text>
  <text class="txt" x="415" y="160" font-size="15" text-anchor="middle">strong</text>
  <ellipse class="ink" cx="305" cy="195" rx="38" ry="17"/>
  <text class="txt" x="305" y="200" font-size="15" text-anchor="middle">acne</text>
  <ellipse class="ink" cx="413" cy="195" rx="46" ry="17"/>
  <text class="txt" x="413" y="200" font-size="14" text-anchor="middle">normal state</text>

  <!-- pulse 3 children -->
  <path class="ink-thin" d="M 570 135 L 520 180 M 570 135 L 655 178"/>
  <text class="txt" x="518" y="160" font-size="15" text-anchor="middle">weak</text>
  <text class="txt" x="645" y="158" font-size="15" text-anchor="middle">strong</text>
  <rect class="ink" x="470" y="180" width="100" height="30"/>
  <text class="txt" x="520" y="201" font-size="15" text-anchor="middle">skin colour</text>
  <ellipse class="ink" cx="655" cy="195" rx="40" ry="17"/>
  <text class="txt" x="655" y="200" font-size="15" text-anchor="middle">herpes</text>

  <!-- skin colour children -->
  <path class="ink-thin" d="M 520 210 L 435 273 M 520 210 L 535 273 M 520 210 L 625 273"/>
  <text class="txt" x="448" y="245" font-size="14" text-anchor="middle">flushed</text>
  <text class="txt" x="553" y="245" font-size="14" text-anchor="middle">normal</text>
  <ellipse class="ink" cx="435" cy="290" rx="44" ry="17"/>
  <text class="txt" x="435" y="295" font-size="14" text-anchor="middle">epizootic</text>
  <ellipse class="ink" cx="535" cy="290" rx="30" ry="17"/>
  <text class="txt" x="535" y="295" font-size="15" text-anchor="middle">flu</text>
  <ellipse class="ink" cx="625" cy="290" rx="32" ry="17"/>
  <text class="txt" x="625" y="295" font-size="15" text-anchor="middle">dead</text>

  <!-- brace under the four left leaves -->
  <path class="ink-thin" d="M 45 222 c 0 9, 9 12, 22 12 H 242 c 8 0, 11 3, 13 8 c 2 -5, 5 -8, 13 -8 H 443 c 13 0, 22 -3, 22 -12"/>
  <text class="txt" x="255" y="262" font-size="15" text-anchor="middle">disease states — leaves</text>

  <!-- small brace under 'herpes' -->
  <path class="ink-thin" d="M 615 222 c 0 8, 6 10, 14 10 H 645 c 6 0, 9 2, 10 6 c 1 -4, 4 -6, 10 -6 H 681 c 8 0, 14 -2, 14 -10"/>
  <text class="txt" x="656" y="252" font-size="14" text-anchor="middle">waxy state</text>

  <!-- brace under the three bottom leaves -->
  <path class="ink-thin" d="M 390 318 c 0 9, 9 12, 22 12 H 512 c 8 0, 11 3, 13 8 c 2 -5, 5 -8, 13 -8 H 638 c 13 0, 22 -3, 22 -12"/>
  <text class="txt" x="525" y="358" font-size="15" text-anchor="middle">disease states — leaves</text>
</svg>
