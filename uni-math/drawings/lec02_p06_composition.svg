<svg xmlns="http://www.w3.org/2000/svg" width="620" height="265" viewBox="0 0 620 265">
  <style>
    .ink { stroke:#d8d8d8; fill:none; stroke-width:2.2; stroke-linecap:round; }
    .ink-thin { stroke:#d8d8d8; fill:none; stroke-width:1.6; stroke-linecap:round; }
    .txt { fill:#d8d8d8; stroke:none; font-family:Georgia,'Times New Roman',serif; font-style:italic; }
    .fill { fill:#d8d8d8; stroke:none; }
    .hl { stroke:#d8d8d8; }
    .dashed { stroke-dasharray:7 6; }
    .dotted { stroke-dasharray:2 6; }
    @media (prefers-color-scheme: light) {
      .ink, .ink-thin { stroke:#1a1a1a; }
      .txt, .fill { fill:#1a1a1a; }
      .hl { stroke:#1a1a1a; }
    }
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path class="fill" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <ellipse class="ink" cx="90" cy="105" rx="55" ry="62"/>
  <ellipse class="ink" cx="310" cy="105" rx="55" ry="62"/>
  <ellipse class="ink" cx="530" cy="105" rx="55" ry="62"/>
  <text class="txt" x="82" y="195" font-size="20">A</text>
  <text class="txt" x="303" y="195" font-size="20">B</text>
  <text class="txt" x="523" y="195" font-size="20">C</text>
  <path class="ink-thin" d="M 132 72 Q 200 42 268 72" marker-end="url(#ah)"/>
  <text class="txt" x="196" y="38" font-size="18">f</text>
  <path class="ink-thin" d="M 352 72 Q 420 42 488 72" marker-end="url(#ah)"/>
  <text class="txt" x="414" y="38" font-size="18">g</text>
  <path class="ink-thin" d="M 105 162 Q 310 255 512 168" marker-end="url(#ah)"/>
  <text class="txt" x="430" y="228" font-size="16">h = g &#8728; f</text>
  <text class="txt" x="310" y="252" font-size="14" text-anchor="middle">Im(f) &#8838; Dom(g)</text>
